name: Build and update release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要更新的 release tag"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build backend core
        working-directory: backend
        run: go build -trimpath -ldflags="-s -w" -o clash-speedtest.exe .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build GUI executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "ClashNodeFilter"
          --add-binary "backend\clash-speedtest.exe;backend"
          --add-data "backend\desktop-config.yaml;backend"
          desktop_app.py

      - name: Show artifact checksum
        run: Get-FileHash "dist\ClashNodeFilter.exe" -Algorithm SHA256

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --title "Clash 节点筛选器 $env:RELEASE_TAG" --notes "由 GitHub Actions 自动构建发布。"
          }

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:RELEASE_TAG" "dist\ClashNodeFilter.exe" --clobber
